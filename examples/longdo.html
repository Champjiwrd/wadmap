<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mapruler — Longdo Map</title>
  <style>html, body, #map { margin: 0; width: 100%; height: 100%; }</style>
</head>
<body>
  <div id="map"></div>
  <script>
    // Open as longdo.html?key=YOUR_LONGDO_KEY — never commit a real key
    const key = new URLSearchParams(location.search).get('key')
    if (!key) document.body.textContent = 'Add ?key=YOUR_LONGDO_KEY to the URL (get one at https://map.longdo.com/console/)'
    else {
      const sdk = document.createElement('script')
      sdk.src = `https://api.longdo.com/map3/?key=${encodeURIComponent(key)}`
      sdk.onload = init
      document.head.appendChild(sdk)
    }

    function init() {
      const map = new longdo.Map({ placeholder: document.getElementById('map'), zoom: 12, location: { lon: 100.5018, lat: 13.7563 } })
      map.Event.bind(longdo.EventName.Ready, () => {
        const ruler = new MapRuler(map, { control: true })
        ruler.on('finish', state => console.log('finished', state))
      })
    }
  </script>
  <script src="../dist/mapruler.min.js"></script>
</body>
</html>
